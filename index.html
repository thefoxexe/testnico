<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The End of Traditional Consulting</title>
<style>
  :root{
    --bg-0:#d9d4c5;
    --bg-1:#eeeae0;
    --ink-0:#151513;
    --ink-1:#4a473e;
    --ink-2:#8c8776;
    --accent:#111110;
  }

  *{box-sizing:border-box;}

  html,body{
    height:100%;
    margin:0;
    padding:0;
    overflow:hidden;
    background:var(--bg-0);
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Helvetica Neue",Inter,Arial,sans-serif;
  }

  .page{
    position:relative;
    width:100vw;
    height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    background:
      radial-gradient(60% 55% at 50% 38%, rgba(255,255,255,0.65) 0%, rgba(255,255,255,0) 60%),
      linear-gradient(180deg, var(--bg-1) 0%, var(--bg-0) 100%);
  }

  /* subtle diagonal line texture, like brushed paper */
  .bg-lines{
    position:absolute;
    inset:0;
    pointer-events:none;
    background-image:repeating-linear-gradient(
      115deg,
      rgba(20,20,15,0.05) 0px,
      rgba(20,20,15,0.05) 1px,
      transparent 1px,
      transparent 7px
    );
    mix-blend-mode:multiply;
    opacity:.55;
  }

  .bg-glow{
    position:absolute;
    top:-10%;
    left:50%;
    transform:translateX(-50%);
    width:70vw;
    height:60vh;
    background:radial-gradient(circle, rgba(255,255,255,0.9) 0%, rgba(255,255,255,0) 65%);
    pointer-events:none;
    filter:blur(10px);
  }

  .vignette{
    position:absolute;
    inset:0;
    pointer-events:none;
    background:radial-gradient(120% 90% at 50% 50%, transparent 55%, rgba(20,18,12,0.18) 100%);
  }

  /* ---------- floating words ---------- */
  .floating-words{
    position:absolute;
    inset:0;
    pointer-events:none;
  }

  .word{
    position:absolute;
    display:flex;
    white-space:nowrap;
    font-size:clamp(11px, 1vw, 13px);
    letter-spacing:.06em;
    text-transform:uppercase;
    color:var(--ink-2);
    font-weight:500;
    animation-name:drift;
    animation-timing-function:ease-in-out;
    animation-iteration-count:infinite;
    will-change:transform;
    opacity:.55;
  }

  .letter{
    display:inline-block;
    transition:
      transform 900ms cubic-bezier(.22,.61,.36,1),
      opacity 900ms cubic-bezier(.22,.61,.36,1),
      filter 900ms cubic-bezier(.22,.61,.36,1);
    transform:translate(0,0) rotate(0deg) scale(1);
    filter:blur(0px);
  }

  .word.exploded .letter{
    opacity:0;
    filter:blur(2px);
    transform:
      translate(var(--dx), var(--dy))
      rotate(var(--rot))
      scale(.4);
  }

  @keyframes drift{
    0%,100%{ transform:translate(0,0) rotate(0deg); }
    25%{ transform:translate(var(--dx1), var(--dy1)) rotate(var(--r1)); }
    50%{ transform:translate(var(--dx2), var(--dy2)) rotate(0deg); }
    75%{ transform:translate(var(--dx3), var(--dy3)) rotate(var(--r2)); }
  }

  /* ---------- hero ---------- */
  .hero{
    position:relative;
    z-index:5;
    max-width:760px;
    padding:0 24px;
    text-align:center;
  }

  .hero h1{
    margin:0 0 22px;
    font-weight:800;
    font-size:clamp(2.4rem, 6vw, 5rem);
    line-height:1.04;
    letter-spacing:-0.035em;
    background:linear-gradient(180deg, var(--ink-0) 0%, #2b2a24 60%, #55523f 100%);
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
    text-shadow:0 1px 0 rgba(255,255,255,0.4);
    opacity:0;
    transform:translateY(14px);
    animation:riseIn 1000ms cubic-bezier(.22,.61,.36,1) 200ms forwards;
  }

  .hero p{
    margin:0 auto 34px;
    max-width:560px;
    font-size:clamp(.95rem, 1.4vw, 1.15rem);
    font-weight:400;
    line-height:1.55;
    color:var(--ink-1);
    opacity:0;
    transform:translateY(10px);
    animation:riseIn 1000ms cubic-bezier(.22,.61,.36,1) 420ms forwards;
  }

  .cta{
    opacity:0;
    transform:translateY(10px);
    animation:riseIn 1000ms cubic-bezier(.22,.61,.36,1) 620ms forwards;

    display:inline-flex;
    align-items:center;
    gap:10px;
    padding:14px 26px;
    border-radius:999px;
    border:none;
    background:linear-gradient(180deg,#232320,#0c0c0b);
    color:#f4f2ea;
    font-size:.95rem;
    font-weight:600;
    letter-spacing:.01em;
    cursor:pointer;
    box-shadow:
      0 1px 0 rgba(255,255,255,0.08) inset,
      0 10px 30px rgba(0,0,0,0.25);
    transition:transform 350ms cubic-bezier(.22,.61,.36,1), box-shadow 350ms;
  }

  .cta:hover{
    transform:translateY(-2px) scale(1.02);
    box-shadow:
      0 1px 0 rgba(255,255,255,0.12) inset,
      0 16px 40px rgba(0,0,0,0.32);
  }

  .cta .dot{
    width:7px;
    height:7px;
    border-radius:50%;
    background:#7CFF9B;
    box-shadow:0 0 10px #7CFF9B;
  }

  @keyframes riseIn{
    to{ opacity:1; transform:translateY(0); }
  }

  @media (max-width:640px){
    .word{ display:none; }
    .hero h1{ font-size:2.1rem; }
  }
</style>
</head>
<body>

<div class="page">
  <div class="bg-lines"></div>
  <div class="bg-glow"></div>

  <div class="floating-words" id="floatingWords"></div>

  <div class="hero">
    <h1>The End of<br>Traditional Consulting</h1>
    <p>Traditional consulting delivers documents that describe your strategy. Productized Consulting delivers intelligent systems that execute it.</p>
    <button class="cta">
      <span class="dot"></span>
      Book a Call
      <span>&rarr;</span>
    </button>
  </div>

  <div class="vignette"></div>
</div>

<script>
(function(){
  const words = [
    { text:"Group Calls",       left: 4,  top: 44 },
    { text:"Playbooks",         left: 9,  top: 24 },
    { text:"Documents",         left: 27, top: 10 },
    { text:"Audits",            left: 55, top: 12 },
    { text:"Manual Execution",  left: 73, top: 9  },
    { text:"Weekly Meetings",   left: 80, top: 27 },
    { text:"Slide Decks",       left: 88, top: 47 },
    { text:"Reports",           left: 83, top: 63 },
    { text:"Frameworks",        left: 17, top: 73 },
    { text:"KPIs",               left: 48, top: 80 },
    { text:"Strategy Docs",     left: 77, top: 77 },
    { text:"Recommendations",   left: 31, top: 89 },
    { text:"Spreadsheets",      left: 4,  top: 87 },
    { text:"Meetings",          left: 2,  top: 63 }
  ];

  const container = document.getElementById('floatingWords');
  const wordEls = [];

  function rnd(min, max){ return Math.random() * (max - min) + min; }

  words.forEach(w => {
    const wordEl = document.createElement('div');
    wordEl.className = 'word';
    wordEl.style.left = w.left + '%';
    wordEl.style.top = w.top + '%';

    // organic drift animation, randomized per word
    wordEl.style.setProperty('--dx1', rnd(-16,16).toFixed(1)+'px');
    wordEl.style.setProperty('--dy1', rnd(-14,14).toFixed(1)+'px');
    wordEl.style.setProperty('--dx2', rnd(-20,20).toFixed(1)+'px');
    wordEl.style.setProperty('--dy2', rnd(-16,16).toFixed(1)+'px');
    wordEl.style.setProperty('--dx3', rnd(-14,14).toFixed(1)+'px');
    wordEl.style.setProperty('--dy3', rnd(-18,18).toFixed(1)+'px');
    wordEl.style.setProperty('--r1', rnd(-5,5).toFixed(1)+'deg');
    wordEl.style.setProperty('--r2', rnd(-5,5).toFixed(1)+'deg');
    wordEl.style.animationDuration = rnd(11,20).toFixed(1)+'s';
    wordEl.style.animationDelay = '-' + rnd(0,20).toFixed(1)+'s';

    [...w.text].forEach(ch => {
      const letterEl = document.createElement('span');
      letterEl.className = 'letter';
      letterEl.textContent = ch === ' ' ? ' ' : ch;
      letterEl.style.setProperty('--dx', rnd(-70,70).toFixed(0)+'px');
      letterEl.style.setProperty('--dy', rnd(-70,70).toFixed(0)+'px');
      letterEl.style.setProperty('--rot', rnd(-180,180).toFixed(0)+'deg');
      wordEl.appendChild(letterEl);
    });

    container.appendChild(wordEl);
    wordEls.push(wordEl);
  });

  function reshuffle(el){
    el.querySelectorAll('.letter').forEach(l => {
      l.style.setProperty('--dx', rnd(-70,70).toFixed(0)+'px');
      l.style.setProperty('--dy', rnd(-70,70).toFixed(0)+'px');
      l.style.setProperty('--rot', rnd(-180,180).toFixed(0)+'deg');
    });
  }

  function explodeAll(){
    wordEls.forEach(el => {
      reshuffle(el);
      const letters = el.querySelectorAll('.letter');
      letters.forEach((l, i) => {
        l.style.transitionDelay = (i * 28) + 'ms';
      });
      el.classList.add('exploded');
    });
  }

  function reformAll(){
    wordEls.forEach(el => {
      const letters = el.querySelectorAll('.letter');
      const n = letters.length;
      letters.forEach((l, i) => {
        l.style.transitionDelay = ((n - i) * 24) + 'ms';
      });
      el.classList.remove('exploded');
    });
  }

  const CYCLE = 9000;   // total loop duration
  const HOLD_EXPLODED = 1500;

  function loop(){
    explodeAll();
    setTimeout(reformAll, HOLD_EXPLODED);
  }

  setTimeout(loop, 3200); // let the entrance animation settle first
  setInterval(loop, CYCLE);
})();
</script>

</body>
</html>
