<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The End of Traditional Consulting</title>
<style>
  :root{
    --bg-0:#d9d4c5;
    --bg-1:#eeeae0;
    --ink-0:#151513;
    --ink-1:#4a473e;
    --ink-2:#8c8776;
    --accent:#7CFF9B;
  }

  *{box-sizing:border-box;}

  html,body{
    height:100%;
    margin:0;
    padding:0;
    background:var(--bg-0);
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Helvetica Neue",Inter,Arial,sans-serif;
  }

  .page{
    position:relative;
    width:100%;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
    background:
      radial-gradient(60% 55% at 50% 38%, rgba(255,255,255,0.65) 0%, rgba(255,255,255,0) 60%),
      linear-gradient(180deg, var(--bg-1) 0%, var(--bg-0) 100%);
  }

  .bg-lines{
    position:absolute;
    inset:0;
    pointer-events:none;
    background-image:repeating-linear-gradient(
      115deg,
      rgba(20,20,15,0.05) 0px,
      rgba(20,20,15,0.05) 1px,
      transparent 1px,
      transparent 7px
    );
    mix-blend-mode:multiply;
    opacity:.55;
  }

  .bg-glow{
    position:absolute;
    top:-10%;
    left:50%;
    transform:translateX(-50%);
    width:70vw;
    height:60vh;
    background:radial-gradient(circle, rgba(255,255,255,0.9) 0%, rgba(255,255,255,0) 65%);
    pointer-events:none;
    filter:blur(10px);
  }

  .vignette{
    position:absolute;
    inset:0;
    pointer-events:none;
    background:radial-gradient(120% 90% at 50% 50%, transparent 55%, rgba(20,18,12,0.18) 100%);
  }

  .floating-words{
    position:absolute;
    inset:0;
    pointer-events:none;
  }

  .orbit{
    position:absolute;
    animation-name:drift;
    animation-timing-function:ease-in-out;
    animation-iteration-count:infinite;
    will-change:transform;
  }

  .word{
    display:flex;
    white-space:nowrap;
    font-size:clamp(10px, 2.6vw, 13px);
    letter-spacing:.06em;
    text-transform:uppercase;
    color:var(--ink-2);
    font-weight:500;
    opacity:.6;
    will-change:transform;
  }

  .word.jiggling{
    animation:jiggle 320ms ease-in-out;
  }

  .letter{
    display:inline-block;
    transition:
      transform 260ms cubic-bezier(.34,1.56,.64,1),
      opacity 220ms ease-out,
      filter 220ms ease-out;
    transform:translate(0,0) rotate(0deg) scale(1);
    filter:blur(0px);
  }

  .word.exploded .letter{
    opacity:.22;
    filter:blur(1.5px);
    transform:
      translate(var(--dx), var(--dy))
      rotate(var(--rot))
      scale(.55);
  }

  .word.reforming .letter{
    transition:
      transform 700ms cubic-bezier(.16,1,.3,1),
      opacity 620ms ease-in,
      filter 620ms ease-in;
  }

  @keyframes drift{
    0%,100%{ transform:translate(0,0) rotate(0deg); }
    25%{ transform:translate(var(--dx1), var(--dy1)) rotate(var(--r1)); }
    50%{ transform:translate(var(--dx2), var(--dy2)) rotate(0deg); }
    75%{ transform:translate(var(--dx3), var(--dy3)) rotate(var(--r2)); }
  }

  @keyframes jiggle{
    0%{ transform:translate(0,0) rotate(0deg); }
    18%{ transform:translate(-3px, 2px) rotate(-4deg); }
    36%{ transform:translate(3px, -2px) rotate(4deg); }
    54%{ transform:translate(-2px, 2px) rotate(-3deg); }
    72%{ transform:translate(2px, -1px) rotate(3deg); }
    88%{ transform:translate(-1px, 1px) rotate(-1deg); }
    100%{ transform:translate(0,0) rotate(0deg); }
  }

  .hero{
    position:relative;
    z-index:5;
    max-width:760px;
    padding:0 24px;
    text-align:center;
  }

  .hero h1{
    margin:0 0 22px;
    font-weight:800;
    font-size:clamp(2rem, 8vw, 5rem);
    line-height:1.04;
    letter-spacing:-0.035em;
    text-wrap:balance;
    background:linear-gradient(180deg, var(--ink-0) 0%, #2b2a24 60%, #55523f 100%);
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
    text-shadow:0 1px 0 rgba(255,255,255,0.4);
    opacity:0;
    transform:translateY(14px);
    animation:riseIn 1000ms cubic-bezier(.22,.61,.36,1) 200ms forwards;
  }

  .hero p{
    margin:0 auto 34px;
    max-width:560px;
    font-size:clamp(.95rem, 1.4vw, 1.15rem);
    font-weight:400;
    line-height:1.55;
    color:var(--ink-1);
    opacity:0;
    transform:translateY(10px);
    animation:riseIn 1000ms cubic-bezier(.22,.61,.36,1) 420ms forwards;
  }

  .cta{
    opacity:0;
    transform:translateY(10px);
    animation:riseIn 1000ms cubic-bezier(.22,.61,.36,1) 620ms forwards;

    display:inline-flex;
    align-items:center;
    gap:10px;
    padding:14px 26px;
    border-radius:999px;
    border:none;
    background:linear-gradient(180deg,#232320,#0c0c0b);
    color:#f4f2ea;
    font-size:.95rem;
    font-weight:600;
    letter-spacing:.01em;
    cursor:pointer;
    box-shadow:
      0 1px 0 rgba(255,255,255,0.08) inset,
      0 10px 30px rgba(0,0,0,0.25);
    transition:transform 350ms cubic-bezier(.22,.61,.36,1), box-shadow 350ms;
  }

  .cta:hover{
    transform:translateY(-2px) scale(1.02);
    box-shadow:
      0 1px 0 rgba(255,255,255,0.12) inset,
      0 16px 40px rgba(0,0,0,0.32);
  }

  .cta .dot{
    width:7px;
    height:7px;
    border-radius:50%;
    background:var(--accent);
    box-shadow:0 0 10px var(--accent);
    flex:none;
  }

  @keyframes riseIn{
    to{ opacity:1; transform:translateY(0); }
  }

  @media (max-width:640px){
    .orbit{ display:none; }
    .hero h1{ font-size:2.4rem; }
  }

  @media (prefers-reduced-motion: reduce){
    .orbit, .word.jiggling{ animation:none; }
    .hero h1, .hero p, .cta{ animation:none; opacity:1; transform:none; }
    .letter{ transition:none; }
  }
</style>
</head>
<body>

<div class="page">
  <div class="bg-lines"></div>
  <div class="bg-glow"></div>

  <div class="floating-words" id="floatingWords"></div>

  <div class="hero">
    <h1>The End of<br>Traditional Consulting</h1>
    <p>Traditional consulting delivers documents that describe your strategy. Productized Consulting delivers intelligent systems that execute it.</p>
    <button class="cta">
      <span class="dot"></span>
      Book a Call
      <span>&rarr;</span>
    </button>
  </div>

  <div class="vignette"></div>
</div>

<script>
(function(){
  const words = [
    { text:"Group Calls",       left: 4,  top: 44 },
    { text:"Playbooks",         left: 9,  top: 24 },
    { text:"Documents",         left: 27, top: 10 },
    { text:"Audits",            left: 55, top: 12 },
    { text:"Manual Execution",  left: 73, top: 9  },
    { text:"Weekly Meetings",   left: 80, top: 27 },
    { text:"Slide Decks",       left: 88, top: 47 },
    { text:"Reports",           left: 83, top: 63 },
    { text:"Frameworks",        left: 17, top: 73 },
    { text:"KPIs",               left: 48, top: 80 },
    { text:"Strategy Docs",     left: 77, top: 77 },
    { text:"Recommendations",   left: 31, top: 89 },
    { text:"Spreadsheets",      left: 4,  top: 87 },
    { text:"Meetings",          left: 2,  top: 63 }
  ];

  const container = document.getElementById('floatingWords');
  const wordEls = [];
  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  function rnd(min, max){ return Math.random() * (max - min) + min; }

  words.forEach(w => {
    const orbitEl = document.createElement('div');
    orbitEl.className = 'orbit';
    orbitEl.style.left = w.left + '%';
    orbitEl.style.top = w.top + '%';

    orbitEl.style.setProperty('--dx1', rnd(-10,10).toFixed(1)+'px');
    orbitEl.style.setProperty('--dy1', rnd(-9,9).toFixed(1)+'px');
    orbitEl.style.setProperty('--dx2', rnd(-13,13).toFixed(1)+'px');
    orbitEl.style.setProperty('--dy2', rnd(-10,10).toFixed(1)+'px');
    orbitEl.style.setProperty('--dx3', rnd(-9,9).toFixed(1)+'px');
    orbitEl.style.setProperty('--dy3', rnd(-11,11).toFixed(1)+'px');
    orbitEl.style.setProperty('--r1', rnd(-4,4).toFixed(1)+'deg');
    orbitEl.style.setProperty('--r2', rnd(-4,4).toFixed(1)+'deg');
    orbitEl.style.animationDuration = rnd(11,20).toFixed(1)+'s';
    orbitEl.style.animationDelay = '-' + rnd(0,20).toFixed(1)+'s';

    const wordEl = document.createElement('div');
    wordEl.className = 'word';

    [...w.text].forEach(ch => {
      const letterEl = document.createElement('span');
      letterEl.className = 'letter';
      letterEl.textContent = ch === ' ' ? ' ' : ch;
      letterEl.style.setProperty('--dx', rnd(-55,55).toFixed(0)+'px');
      letterEl.style.setProperty('--dy', rnd(-55,55).toFixed(0)+'px');
      letterEl.style.setProperty('--rot', rnd(-150,150).toFixed(0)+'deg');
      wordEl.appendChild(letterEl);
    });

    orbitEl.appendChild(wordEl);
    container.appendChild(orbitEl);
    wordEls.push(wordEl);
  });

  if (reduceMotion) return;

  function reshuffle(el){
    el.querySelectorAll('.letter').forEach(l => {
      l.style.setProperty('--dx', rnd(-55,55).toFixed(0)+'px');
      l.style.setProperty('--dy', rnd(-55,55).toFixed(0)+'px');
      l.style.setProperty('--rot', rnd(-150,150).toFixed(0)+'deg');
    });
  }

  function jiggleAll(){
    wordEls.forEach(el => {
      el.classList.remove('jiggling');
      void el.offsetWidth; // restart the shake animation each cycle
      el.classList.add('jiggling');
    });
  }

  function explodeAll(){
    wordEls.forEach(el => {
      reshuffle(el);
      const letters = el.querySelectorAll('.letter');
      letters.forEach((l, i) => {
        l.style.transitionDelay = (i * 14) + 'ms';
      });
      el.classList.remove('reforming');
      el.classList.add('exploded');
    });
  }

  function reformAll(){
    wordEls.forEach(el => {
      const letters = el.querySelectorAll('.letter');
      const n = letters.length;
      letters.forEach((l, i) => {
        l.style.transitionDelay = ((n - i) * 12) + 'ms';
      });
      el.classList.add('reforming');
      el.classList.remove('exploded');
    });
  }

  function settleAll(){
    wordEls.forEach(el => el.classList.remove('reforming'));
  }

  // one full cycle = 2s: gigote (~0.32s) -> explode letter by letter (~0.3s)
  // -> brief hold -> letters ease back gently into place (~0.7s)
  const CYCLE = 2000;
  const T_EXPLODE = 360;
  const T_REFORM = 1000;
  const T_SETTLE = 1900;

  function loop(){
    jiggleAll();
    setTimeout(explodeAll, T_EXPLODE);
    setTimeout(reformAll, T_REFORM);
    setTimeout(settleAll, T_SETTLE);
    setTimeout(loop, CYCLE);
  }

  setTimeout(loop, 1200);
})();
</script>

</body>
</html>
