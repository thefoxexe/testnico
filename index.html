<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The End of Traditional Consulting</title>
<style>
  :root{
    --bg-0:#ffffff;
    --ink-0:#0e0e0d;
    --ink-1:#4b4a45;
    --ink-2:#a4a196;
    --accent:#16a34a;
  }

  *{box-sizing:border-box;}

  html,body{
    height:100%;
    margin:0;
    padding:0;
    background:var(--bg-0);
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Helvetica Neue",Inter,Arial,sans-serif;
  }

  .page{
    position:relative;
    width:100%;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
    background:var(--bg-0);
  }

  .bg-lines{
    position:absolute;
    inset:0;
    pointer-events:none;
    background-image:repeating-linear-gradient(
      115deg,
      rgba(20,20,15,0.035) 0px,
      rgba(20,20,15,0.035) 1px,
      transparent 1px,
      transparent 8px
    );
    opacity:.6;
  }

  .floating-words{
    position:absolute;
    inset:0;
    pointer-events:none;
  }

  .orbit{
    position:absolute;
    animation-name:drift;
    animation-timing-function:ease-in-out;
    animation-iteration-count:infinite;
    will-change:transform;
  }

  .word{
    display:flex;
    white-space:nowrap;
    font-size:clamp(10px, 2.6vw, 13px);
    letter-spacing:.06em;
    text-transform:uppercase;
    color:var(--ink-2);
    font-weight:600;
    opacity:.78;
    will-change:transform;
  }

  .word.jiggling{
    animation:jiggle 420ms ease-in-out;
  }

  .letter{
    display:inline-block;
    transition:
      transform 420ms cubic-bezier(.2,.85,.4,1),
      opacity 300ms ease-out;
    transform:translate(0,0) rotate(0deg) scale(1);
  }

  .word.exploded .letter{
    opacity:.95;
    color:var(--ink-1);
    transform:
      translate(var(--dx), var(--dy))
      rotate(var(--rot))
      scale(var(--sc));
  }

  .word.reforming .letter{
    transition:
      transform 1200ms cubic-bezier(.16,1,.3,1),
      opacity 900ms ease-in;
  }

  @keyframes drift{
    0%,100%{ transform:translate(0,0) rotate(0deg); }
    25%{ transform:translate(var(--dx1), var(--dy1)) rotate(var(--r1)); }
    50%{ transform:translate(var(--dx2), var(--dy2)) rotate(0deg); }
    75%{ transform:translate(var(--dx3), var(--dy3)) rotate(var(--r2)); }
  }

  @keyframes jiggle{
    0%{ transform:translate(0,0) rotate(0deg); }
    15%{ transform:translate(-4px, 2px) rotate(-5deg); }
    30%{ transform:translate(4px, -3px) rotate(5deg); }
    45%{ transform:translate(-3px, 3px) rotate(-4deg); }
    60%{ transform:translate(3px, -2px) rotate(4deg); }
    75%{ transform:translate(-2px, 1px) rotate(-2deg); }
    90%{ transform:translate(1px, -1px) rotate(1deg); }
    100%{ transform:translate(0,0) rotate(0deg); }
  }

  .hero{
    position:relative;
    z-index:5;
    max-width:760px;
    padding:0 24px;
    text-align:center;
  }

  .hero h1{
    margin:0 0 22px;
    font-weight:800;
    font-size:clamp(2rem, 8vw, 5rem);
    line-height:1.04;
    letter-spacing:-0.035em;
    text-wrap:balance;
    color:var(--ink-0);
    opacity:0;
    transform:translateY(14px);
    animation:riseIn 1000ms cubic-bezier(.22,.61,.36,1) 200ms forwards;
  }

  .hero p{
    margin:0 auto 34px;
    max-width:560px;
    font-size:clamp(.95rem, 1.4vw, 1.15rem);
    font-weight:400;
    line-height:1.55;
    color:var(--ink-1);
    opacity:0;
    transform:translateY(10px);
    animation:riseIn 1000ms cubic-bezier(.22,.61,.36,1) 420ms forwards;
  }

  .cta{
    opacity:0;
    transform:translateY(10px);
    animation:riseIn 1000ms cubic-bezier(.22,.61,.36,1) 620ms forwards;

    display:inline-flex;
    align-items:center;
    gap:10px;
    padding:14px 26px;
    border-radius:999px;
    border:none;
    background:linear-gradient(180deg,#232320,#0c0c0b);
    color:#f4f2ea;
    font-size:.95rem;
    font-weight:600;
    letter-spacing:.01em;
    cursor:pointer;
    box-shadow:
      0 1px 0 rgba(255,255,255,0.08) inset,
      0 10px 30px rgba(0,0,0,0.18);
    transition:transform 350ms cubic-bezier(.22,.61,.36,1), box-shadow 350ms;
  }

  .cta:hover{
    transform:translateY(-2px) scale(1.02);
    box-shadow:
      0 1px 0 rgba(255,255,255,0.12) inset,
      0 16px 40px rgba(0,0,0,0.24);
  }

  .cta .dot{
    width:7px;
    height:7px;
    border-radius:50%;
    background:var(--accent);
    box-shadow:0 0 10px var(--accent);
    flex:none;
  }

  @keyframes riseIn{
    to{ opacity:1; transform:translateY(0); }
  }

  @media (max-width:640px){
    .orbit{ display:none; }
    .hero h1{ font-size:2.4rem; }
  }

  @media (prefers-reduced-motion: reduce){
    .orbit, .word.jiggling{ animation:none; }
    .hero h1, .hero p, .cta{ animation:none; opacity:1; transform:none; }
    .letter{ transition:none; }
  }
</style>
</head>
<body>

<div class="page">
  <div class="bg-lines"></div>

  <div class="floating-words" id="floatingWords"></div>

  <div class="hero">
    <h1>The End of<br>Traditional Consulting</h1>
    <p>Traditional consulting delivers documents that describe your strategy. Productized Consulting delivers intelligent systems that execute it.</p>
    <button class="cta">
      <span class="dot"></span>
      Book a Call
      <span>&rarr;</span>
    </button>
  </div>
</div>

<script>
(function(){
  const words = [
    { text:"Group Calls",       left: 4,  top: 44 },
    { text:"Playbooks",         left: 9,  top: 24 },
    { text:"Documents",         left: 27, top: 10 },
    { text:"Audits",            left: 55, top: 12 },
    { text:"Manual Execution",  left: 73, top: 9  },
    { text:"Weekly Meetings",   left: 80, top: 27 },
    { text:"Slide Decks",       left: 88, top: 47 },
    { text:"Reports",           left: 83, top: 63 },
    { text:"Frameworks",        left: 17, top: 73 },
    { text:"KPIs",               left: 48, top: 80 },
    { text:"Strategy Docs",     left: 77, top: 77 },
    { text:"Recommendations",   left: 31, top: 89 },
    { text:"Spreadsheets",      left: 4,  top: 87 },
    { text:"Meetings",          left: 2,  top: 63 }
  ];

  const container = document.getElementById('floatingWords');
  const wordEls = [];
  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  function rnd(min, max){ return Math.random() * (max - min) + min; }

  // radial burst: even spread in every direction, not just a random x/y jitter
  function randomBurst(letterEl, index, total){
    const baseAngle = (index / total) * 360;               // spread letters around the circle...
    const angle = (baseAngle + rnd(-45, 45)) * (Math.PI / 180); // ...then jitter each one
    const radius = rnd(70, 170);
    const dx = Math.cos(angle) * radius;
    const dy = Math.sin(angle) * radius;
    letterEl.style.setProperty('--dx', dx.toFixed(0) + 'px');
    letterEl.style.setProperty('--dy', dy.toFixed(0) + 'px');
    letterEl.style.setProperty('--rot', rnd(-260, 260).toFixed(0) + 'deg');
    letterEl.style.setProperty('--sc', rnd(.8, 1.25).toFixed(2));
  }

  words.forEach(w => {
    const orbitEl = document.createElement('div');
    orbitEl.className = 'orbit';
    orbitEl.style.left = w.left + '%';
    orbitEl.style.top = w.top + '%';

    orbitEl.style.setProperty('--dx1', rnd(-10,10).toFixed(1)+'px');
    orbitEl.style.setProperty('--dy1', rnd(-9,9).toFixed(1)+'px');
    orbitEl.style.setProperty('--dx2', rnd(-13,13).toFixed(1)+'px');
    orbitEl.style.setProperty('--dy2', rnd(-10,10).toFixed(1)+'px');
    orbitEl.style.setProperty('--dx3', rnd(-9,9).toFixed(1)+'px');
    orbitEl.style.setProperty('--dy3', rnd(-11,11).toFixed(1)+'px');
    orbitEl.style.setProperty('--r1', rnd(-4,4).toFixed(1)+'deg');
    orbitEl.style.setProperty('--r2', rnd(-4,4).toFixed(1)+'deg');
    orbitEl.style.animationDuration = rnd(11,20).toFixed(1)+'s';
    orbitEl.style.animationDelay = '-' + rnd(0,20).toFixed(1)+'s';

    const wordEl = document.createElement('div');
    wordEl.className = 'word';

    const chars = [...w.text].filter(ch => ch !== ' ');
    let ci = 0;
    [...w.text].forEach(ch => {
      const letterEl = document.createElement('span');
      letterEl.className = 'letter';
      letterEl.textContent = ch === ' ' ? ' ' : ch;
      if (ch !== ' '){
        randomBurst(letterEl, ci, chars.length);
        ci++;
      }
      wordEl.appendChild(letterEl);
    });

    orbitEl.appendChild(wordEl);
    container.appendChild(orbitEl);
    wordEls.push(wordEl);
  });

  if (reduceMotion) return;

  function reshuffle(el){
    const letters = [...el.querySelectorAll('.letter')].filter(l => l.textContent !== ' ');
    letters.forEach((l, i) => randomBurst(l, i, letters.length));
  }

  function jiggleAll(){
    wordEls.forEach(el => {
      el.classList.remove('jiggling');
      void el.offsetWidth; // restart the shake animation each cycle
      el.classList.add('jiggling');
    });
  }

  function explodeAll(){
    wordEls.forEach(el => {
      reshuffle(el);
      const letters = el.querySelectorAll('.letter');
      letters.forEach((l, i) => {
        l.style.transitionDelay = (i * 22) + 'ms';
      });
      el.classList.remove('reforming');
      el.classList.add('exploded');
    });
  }

  function reformAll(){
    wordEls.forEach(el => {
      const letters = el.querySelectorAll('.letter');
      const n = letters.length;
      letters.forEach((l, i) => {
        l.style.transitionDelay = ((n - i) * 18) + 'ms';
      });
      el.classList.add('reforming');
      el.classList.remove('exploded');
    });
  }

  function settleAll(){
    wordEls.forEach(el => el.classList.remove('reforming'));
  }

  // one full cycle = 3.5s:
  // gigote in place (~0.42s) -> burst outward letter by letter in every
  // direction (~0.5s incl. cascade) -> hold the scattered burst (~0.9s)
  // -> ease gently back into formation (~1.5s incl. cascade)
  const CYCLE = 3500;
  const T_EXPLODE = 500;
  const T_REFORM = 1800;
  const T_SETTLE = 3400;

  function loop(){
    jiggleAll();
    setTimeout(explodeAll, T_EXPLODE);
    setTimeout(reformAll, T_REFORM);
    setTimeout(settleAll, T_SETTLE);
    setTimeout(loop, CYCLE);
  }

  setTimeout(loop, 1200);
})();
</script>

</body>
</html>
